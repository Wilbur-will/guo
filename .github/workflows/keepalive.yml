name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          for attempt in 1 2 3; do
            echo "Keepalive attempt ${attempt}"
            if curl --fail --silent --show-error --location \
              --connect-timeout 20 \
              --max-time 120 \
              https://guo-chuang.onrender.com/ \
              --output /dev/null; then
              echo "Render app responded successfully"
              exit 0
            fi
            sleep 20
          done

          echo "Render app did not respond after retries"
          exit 1
