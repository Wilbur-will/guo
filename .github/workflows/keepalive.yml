name: Keep Render service awake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keepalive.yml"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping Render app
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Keepalive attempt ${attempt} at $(date -u)"
            curl --fail --silent --show-error --location \
              --connect-timeout 20 \
              --max-time 120 \
              https://guo-chuang.onrender.com/ \
              --output /dev/null || true

            if [ "${attempt}" != "8" ]; then
              sleep 30
            fi
          done

          echo "Keepalive window finished"
