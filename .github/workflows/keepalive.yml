name: Keep Render service awake
# Calls /keepalive, which holds the request open for about one minute.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keepalive.yml"
      - "my-app/main.py"
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render app
        run: |
          echo "Keepalive request started at $(date -u)"
          curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 150 \
            https://guo-chuang.onrender.com/keepalive
          echo
          echo "Keepalive request finished at $(date -u)"
