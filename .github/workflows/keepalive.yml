name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://guo-chuang.onrender.com/ \
            --output /dev/null
